<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="This HTML & CSS only challenge is perfect for anyone just starting out or anyone wanting a small project to play around with.">
    <meta name="author" content="Anees Ul Rehman">
    <link rel="shortcut icon" href="assets/images/favicon-32x32.png" type="image/png">
    <link rel="stylesheet" href="style.css">

    <title>NFT preview card component | Frontend Mentor</title>
</head>

<body>
    <main>
        <section class="stack">
            <div class="main-card-container stack">
                <div class="image-container">
                    <img class="main-image" src="assets/images/image-equilibrium.jpg" alt="Equilibrium">
                    <div class="image-overlay stack">
                        <img src="assets/images/icon-view.svg" alt="view">
                    </div>
                </div>
                <div>
                    <h1>Equilibrium #3420</h1>
                    <p>Our Equilibrium collection promotes balance and calm.</p>
                </div>
                <div class="offer-time-left stack">
                    <div class="eth stack">
                        <img src="assets/images/icon-ethereum.svg" alt="Ethereum">
                        0.041 ETH
                    </div>
                    <div class="days-left stack">
                        <img src="assets/images/icon-clock.svg" alt="Time remaining">
                        3 days left
                    </div>
                </div>
                <div class="profile stack">
                    <img class="profile-image" src="assets/images/image-avatar.png" alt="profile pic">
                    <p>Creation of <span>Jules Wyver</span></p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
